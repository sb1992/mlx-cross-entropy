[build-system]
requires = [
  "setuptools>=42",
  "cmake>=3.27",
  "mlx>=0.22.0",
  "nanobind==2.12.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-cross-entropy"
dynamic = ["version"]
description = "Memory-efficient Cut Cross-Entropy for MLX on Apple Silicon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "mlx>=0.22.0",
]
keywords = ["mlx", "apple-silicon", "cross-entropy", "metal", "llm", "memory-efficient"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/sb1992/mlx-cross-entropy"
Paper = "https://arxiv.org/abs/2411.09009"
Issues = "https://github.com/sb1992/mlx-cross-entropy/issues"

[tool.setuptools.packages.find]
include = ["mlx_cce*"]

[tool.setuptools.dynamic]
version = {attr = "mlx_cce.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
lint.select = ["F", "I", "E"]
